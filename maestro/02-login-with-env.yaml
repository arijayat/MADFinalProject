appId: com.binanusantara.stemlearninglab
env:
    TEST_EMAIL: "bunleap@mail.com"
    TEST_PASSWORD: "Bun123"
---
- launchApp:
      clearState: true
- extendedWaitUntil:
      visible: "LOG IN"
      timeout: 12000
- tapOn: "LOG IN"
- assertVisible: "Log in"
- tapOn: "you@school.edu"
- inputText: "${TEST_EMAIL}"
- tapOn: "••••••••"
- inputText: "${TEST_PASSWORD}"
- hideKeyboard
- tapOn:
      point: "50%,93%"
- extendedWaitUntil:
      visible:
          text: ".*(Home|Your team|REGISTER NEW TEAM|JOIN EXISTING TEAM).*"
      timeout: 20000
- takeScreenshot: after-login
