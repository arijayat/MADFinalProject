appId: com.binanusantara.stemlearninglab
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: ".*(Home|Profile|Activities).*"
    timeout: 12000
- tapOn: "PROFILE"
- tapOn: "Settings"
- tapOn: "Change password"
- assertVisible:
    text: ".*(Change password|Current password|New password).*"
- assertVisible: "At least 6 characters"
- tapOn: "UPDATE PASSWORD"
- assertVisible: "Missing fields"
- tapOn: "OK"
- runFlow:
    when:
      visible: "Change password"
    commands:
      - back
- takeScreenshot: change-password-validation
